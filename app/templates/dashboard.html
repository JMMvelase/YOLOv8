<body class="min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-sky-500/40 font-sans">

      <ul class="flex gap-6 text-sm">
        <li><button class="group flex items-center gap-2 text-sky-400" onclick="window.location.href='/dashboard.html'"><i data-lucide="home" class="w-4 h-4 stroke-[1.5]"></i><span class="hidden md:inline">Home</span></button></li>
        <li><button class="group flex items-center gap-2 hover:text-sky-400 transition" onclick="window.location.href='/employee.html'"><i data-lucide="user" class="w-4 h-4 stroke-[1.5]"></i><span class="hidden md:inline">Employees</span></button></li>
        <li><button class="group flex items-center gap-2 hover:text-sky-400 transition" onclick="window.location.href='/history.html'"><i data-lucide="history" class="w-4 h-4 stroke-[1.5]"></i><span class="hidden md:inline">History</span></button></li>
      
 </ul>
    </nav>
  </header>

  <!-- ========== MAIN LAYOUT ========== -->
  <main class="mx-auto max-w-7xl px-6 py-10 grid lg:grid-cols-12 gap-10">

    <!-- ------ WEBCAM DETECTION ------ -->
    <section class="lg:col-span-12 flex flex-col gap-4">
      <h2 class="text-xl tracking-tight font-semibold">Live Webcam Detection</h2>
      <div class="grid lg:grid-cols-2 gap-4 rounded-xl overflow-hidden ring-1 ring-slate-800 shadow-lg bg-slate-800 p-4">
        <!-- Live Camera -->
        <div class="flex flex-col gap-2">
          <span class="text-xs text-slate-400">Live Camera Feed</span>
          <video id="webcam" autoplay playsinline class="w-full h-80 bg-black rounded transform scale-x-[-1]"></video>
        </div>
        <!-- Detection Output -->
        <div class="flex flex-col gap-2">
          <span class="text-xs text-slate-400">Detection Output</span>
          <canvas id="output" class="w-full h-80 bg-black rounded"></canvas>
        </div>
      </div>
      
      <div id="status" class="p-3 rounded-lg text-sm font-medium bg-red-900/30 text-red-300 text-center">
        Camera: Inactive
      </div>
      
      <div class="flex gap-2 justify-center flex-wrap">
        <button onclick="startCamera()" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-medium transition">
          📹 Start Camera
        </button>
        <button onclick="stopCamera()" class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition">
          ⏹️ Stop Camera
        </button>
        <button id="detectBtn" onclick="toggleAutoDetect()" disabled class="px-6 py-2 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-600 text-white rounded-lg font-medium transition">
          🔍 Start Auto-Detect
        </button>
      </div>
      
      <div class="p-4 bg-slate-900/60 rounded-lg ring-1 ring-slate-800">
        <h3 class="text-sm font-semibold mb-3">Detection Results</h3>
        <div id="resultsContent" class="text-sm text-slate-400">
          <p>Start the camera to begin detection...</p>
        </div>
      </div>
    </section>

    <!-- ------ LIVE FEED ------ --> -->
  
<section class="lg:col-span-8 flex flex-col gap-4">
  <h2 class="text-xl tracking-tight font-semibold">Live Camera Feed</h2>
  <div class="relative rounded-xl overflow-hidden ring-1 ring-slate-800 shadow-lg">
    <div class="bg-slate-800">
      <!-- Camera 0 -->
      <div class="relative">
        <img id="videoFeed0" src="/video0" alt="Camera 0 - Click to enlarge" class="w-full h-96 object-cover cursor-pointer hover:opacity-90 transition" onerror="this.src='/static/camera-error.svg'; this.classList.add('opacity-50');"/>
        <span class="absolute bottom-2 left-2 text-xs bg-black/50 px-2 py-1 rounded">Camera 1</span>
      </div>
<!-- Modal for enlarged view -->
<div id="viewerModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">
  <div class="relative max-w-2xl w-full mx-4">
    <button id="viewerClose" class="absolute top-4 right-4 text-white bg-slate-800/70 rounded px-3 py-1 hover:bg-slate-700 z-60">✕</button>
    <img id="viewerImg" src="" alt="Enlarged Feed" class="w-full h-auto rounded shadow-lg border pointer-events-none"/>
  </div>
</div>

<script>
  // ...existing code...

  function closeViewer() {
    // Stop stream by clearing src
    viewerImg.src = '';
    modal.classList.remove('flex');
    modal.classList.add('hidden');
    document.body.style.overflow = '';
  }

  // Attach click handlers to both feeds
  document.getElementById('videoFeed0').addEventListener('click', () => openViewer('/video0'));

  // Close handlers - modal background click
  modal.addEventListener('click', (e) => { 
    if (e.target === modal) closeViewer(); 
  });
  
  // Close button click
  viewerClose.addEventListener('click', closeViewer);
  
  // Escape key
  document.addEventListener('keydown', (e) => { 
    if (e.key === 'Escape' && modal.classList.contains('flex')) closeViewer(); 
  });
</script>

</section>


    <!-- ------ DATA PANEL ------ -->
    <aside class="lg:col-span-4 flex flex-col gap-8">
      <!-- Object Counts -->
      <section class="p-6 rounded-xl ring-1 ring-slate-800 bg-slate-900/60 shadow-lg">
        <h3 class="text-lg tracking-tight font-semibold mb-4">Detections</h3>
        <div class="space-y-4" id="countList"></div>
      </section>

      <!-- Bar Chart -->
      <section class="p-6 rounded-xl ring-1 ring-slate-800 bg-slate-900/60 shadow-lg">
        <h3 class="text-lg tracking-tight font-semibold mb-4">Frequency Chart</h3>
        <div class="relative">
          <canvas id="countChart" height="180"></canvas>
        </div>
      </section>
    </aside>
  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="text-xs text-slate-500 text-center py-6 border-t border-slate-800">
    Built with Anger by Ndumiso Mthembu
  </footer>

  <script>
    // ========== WEBCAM DETECTION =========
    let stream;
    let autoDetectInterval;
    let isAutoDetecting = false;
    const video = document.getElementById('webcam');
    const hiddenCanvas = document.createElement('canvas');
    const outputCanvas = document.getElementById('output');
    const detectBtn = document.getElementById('detectBtn');
    const resultsDiv = document.getElementById('resultsContent');
    const statusDiv = document.getElementById('status');
    
    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            width: { ideal: 640 },
            height: { ideal: 480 }
          } 
        });
        video.srcObject = stream;
        detectBtn.disabled = false;
        statusDiv.className = 'p-3 rounded-lg text-sm font-medium bg-emerald-900/30 text-emerald-300 text-center';
        statusDiv.textContent = 'Camera: Active';
        
        // Set output canvas size
        video.addEventListener('loadedmetadata', () => {
          outputCanvas.width = video.videoWidth;
          outputCanvas.height = video.videoHeight;
        });
      } catch (err) {
        alert('Could not access camera: ' + err.message);
        console.error('Camera error:', err);
      }
    }
    
    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        detectBtn.disabled = true;
        statusDiv.className = 'p-3 rounded-lg text-sm font-medium bg-red-900/30 text-red-300 text-center';
        statusDiv.textContent = 'Camera: Inactive';
        
        if (isAutoDetecting) {
          toggleAutoDetect();
        }
      }
    }
    
    function toggleAutoDetect() {
      if (isAutoDetecting) {
        clearInterval(autoDetectInterval);
        isAutoDetecting = false;
        detectBtn.textContent = '🔍 Start Auto-Detect';
        detectBtn.className = 'px-6 py-2 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-600 text-white rounded-lg font-medium transition';
      } else {
        isAutoDetecting = true;
        detectBtn.textContent = '⏸️ Stop Auto-Detect';
        detectBtn.className = 'px-6 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-lg font-medium transition';
        
        detectPPE();
        autoDetectInterval = setInterval(detectPPE, 1000);
      }
    }
    
    async function detectPPE() {
      const ctx = hiddenCanvas.getContext('2d');
      hiddenCanvas.width = video.videoWidth;
      hiddenCanvas.height = video.videoHeight;
      
      ctx.drawImage(video, 0, 0);
      
      hiddenCanvas.toBlob(async (blob) => {
        const formData = new FormData();
        formData.append('image', blob, 'frame.jpg');
        
        try {
          const response = await fetch('/detect-webcam', {
            method: 'POST',
            body: formData
          });
          
          const result = await response.json();
          drawDetections(result);
          displayResults(result);
        } catch (err) {
          console.error('Detection error:', err);
          resultsDiv.innerHTML = '<p class="text-red-400">Error: ' + err.message + '</p>';
        }
      }, 'image/jpeg', 0.95);
    }
    
    function drawDetections(result) {
      const ctx = outputCanvas.getContext('2d');
      
      // Draw mirrored video frame
      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(video, -outputCanvas.width, 0, outputCanvas.width, outputCanvas.height);
      ctx.restore();
      
      if (result.predictions && result.predictions.length > 0) {
        result.predictions.forEach(pred => {
          const mirroredX = outputCanvas.width - pred.x;
          
          ctx.strokeStyle = '#00FF00';
          ctx.lineWidth = 3;
          ctx.strokeRect(
            mirroredX - pred.width/2, 
            pred.y - pred.height/2, 
            pred.width, 
            pred.height
          );
          
          const label = `${pred.class} ${(pred.confidence * 100).toFixed(1)}%`;
          ctx.font = 'bold 16px Arial';
          const textWidth = ctx.measureText(label).width;
          
          ctx.fillStyle = 'rgba(0, 255, 0, 0.8)';
          ctx.fillRect(
            mirroredX - pred.width/2,
            pred.y - pred.height/2 - 25,
            textWidth + 10,
            25
          );
          
          ctx.fillStyle = '#000';
          ctx.fillText(
            label,
            mirroredX - pred.width/2 + 5,
            pred.y - pred.height/2 - 7
          );
        });
      }
    }
    
    function displayResults(result) {
      if (result.error) {
        resultsDiv.innerHTML = `<p class="text-red-400">Error: ${result.error}</p>`;
        return;
      }
      
      if (result.predictions && result.predictions.length > 0) {
        const html = result.predictions.map(p => `
          <div class="flex justify-between items-center p-2 bg-slate-800 rounded mb-2">
            <span class="text-slate-200">${p.class}</span>
            <span class="text-emerald-400 font-semibold">${(p.confidence * 100).toFixed(1)}%</span>
          </div>
        `).join('');
        
        resultsDiv.innerHTML = html;
      } else {
        resultsDiv.innerHTML = '<p class="text-slate-400">No PPE detected in frame</p>';
      }
    }

    // Init Lucide
    lucide.createIcons();

    // Simple element fade/slide-in on load
    document.querySelectorAll('header, main > *, footer').forEach((el, idx) => {
      el.style.opacity = 0;
      el.style.transform = 'translateY(24px)';
      el.style.transition = 'opacity .6s ease, transform .6s ease';
      setTimeout(() => {
        el.style.opacity = 1;
        el.style.transform = 'translateY(0)';
      }, 100 + idx * 100);
    });

    // Navigation helper
    const navigate = hash => window.location.hash = hash;

    // ------------- Chart.js Setup -------------
    const ctx = document.getElementById('countChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'bar',
      data: {labels: [], datasets: [{label: 'Count', data: [], backgroundColor: '#0ea5e9'}]},
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {legend: {display: false}},
        scales: {
          x: {ticks: {color: '#94a3b8'}, grid: {display: false, color: '#1e293b'}},
          y: {ticks: {color: '#94a3b8'}, grid: {color: '#1e293b'}}
        }
      }
    });

    // ------------- Counts Fetching -------------
    async function updateCounts() {
      try {
        const res = await fetch('/counts');
        const data = await res.json();

        // List
        const list = document.getElementById('countList');
        list.innerHTML = '';
        Object.entries(data).forEach(([k, v]) => {
          const barLen = Math.min(v * 6, 160);
          list.insertAdjacentHTML('beforeend', `
            <div class="flex items-center justify-between text-sm">
              <span class="capitalize">${k}</span>
              <span class="flex-1 mx-4 bg-slate-800 h-2 rounded overflow-hidden">
                <span style="width:${barLen}px" class="block h-full bg-sky-500"></span>
              </span>
              <span class="tabular-nums">${v}</span>
            </div>
          `);
        });

        // Chart
        chart.data.labels = Object.keys(data);
        chart.data.datasets[0].data = Object.values(data);
        chart.update();

      } catch (e) {
        console.error(e);
      }
    }
    updateCounts();
    setInterval(updateCounts, 2000);

    // --------- Click-to-enlarge viewer ---------
    const modal = document.getElementById('viewerModal');
    const viewerImg = document.getElementById('viewerImg');
    const viewerClose = document.getElementById('viewerClose');

    function openViewer(src, title) {
      // Use the MJPEG stream endpoint as the image src
      viewerImg.src = src;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      // prevent background scrolling
      document.body.style.overflow = 'hidden';
    }

    function closeViewer() {
      // Stop stream by clearing src
      viewerImg.src = '';
      modal.classList.remove('flex');
      modal.classList.add('hidden');
      document.body.style.overflow = '';
    }

    // Attach click handlers
    document.getElementById('videoFeed0').addEventListener('click', () => openViewer('/video0'));

    // Close handlers
    viewerClose.addEventListener('click', closeViewer);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeViewer(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeViewer(); });
  </script>
</body>
