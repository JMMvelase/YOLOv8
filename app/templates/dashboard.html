<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vision Dashboard</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-sky-500/40 font-sans">

  <!-- ========== TOP NAV ========== -->
  <header class="backdrop-blur bg-slate-900/60 sticky top-0 z-50 border-b border-slate-800">
    <nav class="mx-auto max-w-7xl px-6 flex items-center justify-between h-16">
      <h1 class="text-lg tracking-tight font-semibold">ZAKHE AI PPE DETECTION</h1>

      <ul class="flex gap-6 text-sm">
        <li><button class="group flex items-center gap-2 text-sky-400" onclick="window.location.href='/dashboard.html'"><i data-lucide="home" class="w-4 h-4 stroke-[1.5]"></i><span class="hidden md:inline">Home</span></button></li>
        <li><button class="group flex items-center gap-2 hover:text-sky-400 transition" onclick="window.location.href='/employee.html'"><i data-lucide="user" class="w-4 h-4 stroke-[1.5]"></i><span class="hidden md:inline">Employees</span></button></li>
        <li><button class="group flex items-center gap-2 hover:text-sky-400 transition" onclick="window.location.href='/history.html'"><i data-lucide="history" class="w-4 h-4 stroke-[1.5]"></i><span class="hidden md:inline">History</span></button></li>
      </ul>
    </nav>
  </header>

  <!-- ========== MAIN LAYOUT ========== -->
  <main class="mx-auto max-w-7xl px-6 py-10 grid lg:grid-cols-12 gap-10">

    <!-- ------ LIVE FEED ------ -->
    <section class="lg:col-span-8 flex flex-col gap-4">
      <div class="flex items-center justify-between">
        <h2 class="text-xl tracking-tight font-semibold">Live Webcam Feed</h2>
        <div id="cameraStatus" class="flex items-center gap-2 text-sm">
          <div class="w-2 h-2 rounded-full bg-slate-600" id="statusDot"></div>
          <span id="statusText">Camera Inactive</span>
        </div>
      </div>

      <!-- Camera Controls -->
      <div class="flex gap-3 flex-wrap">
        <button id="startBtn" onclick="startCamera()" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg text-sm font-medium transition flex items-center gap-2">
          <i data-lucide="video" class="w-4 h-4"></i>
          Start Camera
        </button>
        <button id="stopBtn" onclick="stopCamera()" disabled class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-sm font-medium transition flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
          <i data-lucide="video-off" class="w-4 h-4"></i>
          Stop Camera
        </button>
        <button id="detectBtn" onclick="toggleAutoDetect()" disabled class="px-4 py-2 bg-sky-600 hover:bg-sky-700 rounded-lg text-sm font-medium transition flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
          <i data-lucide="scan" class="w-4 h-4"></i>
          Start Detection
        </button>
      </div>

      <!-- Video Feed with Detection Overlay -->
      <div class="relative rounded-xl overflow-hidden ring-1 ring-slate-800 shadow-lg bg-slate-900" style="width: 100%; max-width: 100%;">
        <div style="position: relative; width: 100%; padding-bottom: 62.5%;">
          <video id="webcam" autoplay playsinline style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; background: #1e293b;"></video>
          <canvas id="output" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></canvas>
        </div>
      </div>

      <!-- Hidden canvas for processing -->
      <canvas id="canvas" style="display:none;"></canvas>
    </section>

    <!-- ------ DATA PANEL ------ -->
    <aside class="lg:col-span-4 flex flex-col gap-8">
      <!-- Bar Chart -->
      <section class="p-6 rounded-xl ring-1 ring-slate-800 bg-slate-900/60 shadow-lg">
        <h3 class="text-lg tracking-tight font-semibold mb-4">Detection Frequency</h3>
        <div class="relative">
          <canvas id="countChart" height="180"></canvas>
        </div>
      </section>

      <!-- Object Counts -->
      <section class="p-6 rounded-xl ring-1 ring-slate-800 bg-slate-900/60 shadow-lg">
        <h3 class="text-lg tracking-tight font-semibold mb-4">Live Detections</h3>
        <div class="space-y-4" id="countList">
          <p class="text-sm text-slate-400">Detections will appear here...</p>
        </div>
      </section>
    </aside>
    </section>

  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="text-xs text-slate-500 text-center py-6 border-t border-slate-800">
    Built with Anger by Ndumiso Mthembu
  </footer>

  <script>
    // Init Lucide
    lucide.createIcons();

    // Simple element fade/slide-in on load
    document.querySelectorAll('header, main > *, footer').forEach((el, idx) => {
      el.style.opacity = 0;
      el.style.transform = 'translateY(24px)';
      el.style.transition = 'opacity .6s ease, transform .6s ease';
      setTimeout(() => {
        el.style.opacity = 1;
        el.style.transform = 'translateY(0)';
      }, 100 + idx * 100);
    });

    // ------------- Chart.js Setup -------------
    const ctx = document.getElementById('countChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'bar',
      data: {labels: [], datasets: [{label: 'Count', data: [], backgroundColor: '#0ea5e9'}]},
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {legend: {display: false}},
        scales: {
          x: {ticks: {color: '#94a3b8'}, grid: {display: false, color: '#1e293b'}},
          y: {ticks: {color: '#94a3b8'}, grid: {color: '#1e293b'}}
        }
      }
    });

    // ------------- WebRTC Camera Setup -------------
    let stream;
    let autoDetectInterval;
    let isAutoDetecting = false;
    let detectionCounts = {};
    let recentAlerts = [];
    
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const outputCanvas = document.getElementById('output');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const detectBtn = document.getElementById('detectBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            width: { ideal: 640 },
            height: { ideal: 480 }
          } 
        });
        
        video.srcObject = stream;
        
        video.addEventListener('loadedmetadata', () => {
          outputCanvas.width = video.videoWidth;
          outputCanvas.height = video.videoHeight;
        });
        
        // Update UI
        startBtn.disabled = true;
        stopBtn.disabled = false;
        detectBtn.disabled = false;
        statusDot.className = 'w-2 h-2 rounded-full bg-green-500 animate-pulse';
        statusText.textContent = 'Camera Active';
        
        lucide.createIcons();
        
      } catch (err) {
        alert('Could not access camera: ' + err.message);
        console.error('Camera error:', err);
      }
    }
    
    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        
        if (isAutoDetecting) {
          toggleAutoDetect();
        }
        
        // Update UI
        startBtn.disabled = false;
        stopBtn.disabled = true;
        detectBtn.disabled = true;
        statusDot.className = 'w-2 h-2 rounded-full bg-slate-600';
        statusText.textContent = 'Camera Inactive';
        
        // Clear output
        const ctx = outputCanvas.getContext('2d');
        ctx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
      }
    }
    
    function toggleAutoDetect() {
      if (isAutoDetecting) {
        // Stop auto-detect
        clearInterval(autoDetectInterval);
        isAutoDetecting = false;
        detectBtn.innerHTML = '<i data-lucide="scan" class="w-4 h-4"></i> Start Detection';
        detectBtn.className = 'px-4 py-2 bg-sky-600 hover:bg-sky-700 rounded-lg text-sm font-medium transition flex items-center gap-2';
      } else {
        // Start auto-detect
        isAutoDetecting = true;
        detectBtn.innerHTML = '<i data-lucide="pause" class="w-4 h-4"></i> Stop Detection';
        detectBtn.className = 'px-4 py-2 bg-orange-600 hover:bg-orange-700 rounded-lg text-sm font-medium transition flex items-center gap-2';
        
        // Detect immediately
        detectPPE();
        
        // Then detect every 1.5 seconds
        autoDetectInterval = setInterval(detectPPE, 1500);
      }
      
      lucide.createIcons();
    }
    
    async function detectPPE() {
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      
      // Draw current frame to hidden canvas
      ctx.drawImage(video, 0, 0);
      
      // Convert canvas to blob
      canvas.toBlob(async (blob) => {
        const formData = new FormData();
        formData.append('image', blob, 'frame.jpg');
        
        try {
          const response = await fetch('/detect-webcam', {
            method: 'POST',
            body: formData
          });
          
          const result = await response.json();
          
          // Draw detections on output canvas
          drawDetections(result);
          
          // Update counts
          updateCounts(result);
          
        } catch (err) {
          console.error('Detection error:', err);
        }
      }, 'image/jpeg', 0.90);
    }
    
    function drawDetections(result) {
      const ctx = outputCanvas.getContext('2d');
      
      // Set canvas size to match video
      outputCanvas.width = video.videoWidth;
      outputCanvas.height = video.videoHeight;
      
      // Clear canvas
      ctx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
      
      // Draw the current video frame (mirrored)
      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(video, -outputCanvas.width, 0, outputCanvas.width, outputCanvas.height);
      ctx.restore();
      
      // Draw bounding boxes
      if (result.predictions && result.predictions.length > 0) {
        result.predictions.forEach(pred => {
          // Mirror the x coordinate
          const mirroredX = outputCanvas.width - pred.x;
          
          // Choose color based on class
          const color = getColorForClass(pred.class);
          
          // Draw bounding box
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.strokeRect(
            mirroredX - pred.width/2, 
            pred.y - pred.height/2, 
            pred.width, 
            pred.height
          );
          
          // Draw label background
          const label = `${pred.class} ${(pred.confidence * 100).toFixed(0)}%`;
          ctx.font = 'bold 14px Arial';
          const textWidth = ctx.measureText(label).width;
          
          ctx.fillStyle = color;
          ctx.fillRect(
            mirroredX - pred.width/2,
            pred.y - pred.height/2 - 22,
            textWidth + 10,
            22
          );
          
          // Draw label text
          ctx.fillStyle = '#000';
          ctx.fillText(
            label,
            mirroredX - pred.width/2 + 5,
            pred.y - pred.height/2 - 6
          );
        });
      }
    }
    
    function getColorForClass(className) {
      const colors = {
        'helmet': '#10b981',
        'vest': '#f59e0b',
        'person': '#3b82f6',
        'no-helmet': '#ef4444',
        'no-vest': '#ef4444'
      };
      return colors[className.toLowerCase()] || '#0ea5e9';
    }
    
    function updateCounts(result) {
      if (!result.predictions) return;
      
      // Reset counts
      const currentCounts = {};
      
      // Count detections
      result.predictions.forEach(pred => {
        const className = pred.class;
        currentCounts[className] = (currentCounts[className] || 0) + 1;
        
        // Add to recent alerts if confidence is high
        if (pred.confidence > 0.7) {
          addRecentAlert(className, pred.confidence);
        }
      });
      
      // Update global counts
      detectionCounts = currentCounts;
      
      // Update list display
      const list = document.getElementById('countList');
      list.innerHTML = '';
      
      if (Object.keys(currentCounts).length === 0) {
        list.innerHTML = '<p class="text-sm text-slate-400">No detections in frame</p>';
      } else {
        Object.entries(currentCounts).forEach(([k, v]) => {
          const barLen = Math.min(v * 30, 160);
          const color = getColorForClass(k);
          list.insertAdjacentHTML('beforeend', `
            <div class="flex items-center justify-between text-sm">
              <span class="capitalize font-medium">${k}</span>
              <span class="flex-1 mx-4 bg-slate-800 h-2 rounded overflow-hidden">
                <span style="width:${barLen}px; background-color:${color}" class="block h-full"></span>
              </span>
              <span class="tabular-nums font-bold">${v}</span>
            </div>
          `);
        });
      }
      
      // Update chart
      chart.data.labels = Object.keys(currentCounts);
      chart.data.datasets[0].data = Object.values(currentCounts);
      chart.data.datasets[0].backgroundColor = Object.keys(currentCounts).map(k => getColorForClass(k));
      chart.update();
    }
    
    function addRecentAlert(className, confidence) {
      const time = new Date().toLocaleTimeString();
      const alert = { className, confidence, time };
      
      recentAlerts.unshift(alert);
      if (recentAlerts.length > 10) recentAlerts.pop();
      
      const container = document.getElementById('recentDetections');
      container.innerHTML = recentAlerts.map(a => `
        <div class="text-xs p-2 bg-slate-800/50 rounded flex justify-between items-center">
          <span class="capitalize">${a.className}</span>
          <span class="text-slate-400">${a.time}</span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
